services:
  - type: web
    name: dailyjob-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CELERY_EAGER
        value: "True"

  - type: cron
    name: dailyjob-cron
    runtime: python
    schedule: "0 * * * *"
    buildCommand: "./build.sh"
    startCommand: "python manage.py delete_expired_ads"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromService:
          type: web
          name: dailyjob-backend
          envVarKey: DATABASE_URL
